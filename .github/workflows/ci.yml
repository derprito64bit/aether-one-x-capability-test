name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run test
  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run analyze
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # All three engines: `npm run e2e` is the full chromium/firefox/webkit matrix.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run preview -- --port 4173 --strictPort --host 127.0.0.1 &
      - run: sleep 4
      # Thresholds asserted in CI: accessibility, best-practices, SEO.
      # Performance is measured, not asserted: CI renders WebGL through
      # SwiftShader (software GL), so a perf score would test the CPU
      # rasterizer, not the site. Real-GPU numbers are the M10 trace.
      # --disable-full-page-screenshot: capturing the WebGL page in software GL
      # timed out (Page.captureScreenshot) and crashed the run; the asserted
      # categories do not need it.
      - run: >
          npx lighthouse http://127.0.0.1:4173/
          --preset=desktop --quiet --chrome-flags="--headless --no-sandbox"
          --output=json --output-path=/tmp/lh.json
          --only-categories=accessibility,best-practices,seo
          --disable-full-page-screenshot
      - run: >
          node -e "const r=require('/tmp/lh.json');
          const c=r.categories;
          for (const k of ['accessibility','best-practices','seo']) {
            if (c[k].score < 0.9) throw new Error(k + ' below 0.9: ' + c[k].score);
          }
          console.log('lighthouse ok:', Object.entries(c).map(([k,v])=>k+'='+v.score).join(' '));"
